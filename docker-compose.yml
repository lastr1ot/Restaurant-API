services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rest
      POSTGRES_PASSWORD: rest
      POSTGRES_DB: restaurant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rest -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rest:rest@db:5432/restaurant
      SYNC_DATABASE_URL: postgresql+psycopg2://rest:rest@db:5432/restaurant
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
  
  worker:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
    command: arq worker.WorkerSettings

volumes:
  pgdata: