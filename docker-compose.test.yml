services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: restaurant_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d restaurant_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build: .
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@test-db:5432/restaurant_test
    command: python -m pytest -v